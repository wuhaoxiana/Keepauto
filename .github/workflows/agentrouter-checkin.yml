name: AgentRouter 每日签到

on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 安装依赖
        working-directory: ./agentrouter
        run: pip install -r requirements.txt

      - name: ✅ 执行签到
        working-directory: ./agentrouter
        env:
          AGENTROUTER_BASE_URL: ${{ vars.AGENTROUTER_BASE_URL }}
          AGENTROUTER_USERNAME: ${{ vars.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ vars.AGENTROUTER_PASSWORD }}
          AGENTROUTER_ACCOUNTS: ${{ vars.AGENTROUTER_ACCOUNTS }}
          SOCKS5_PROXY: ${{ vars.SOCKS5_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py

      - name: 🧹 清理旧的工作流运行记录
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done 
