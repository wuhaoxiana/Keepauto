name: Update SOCKS5 Proxy List

on:
  schedule:
    # 每天 0 点（UTC），可按需改为北京时间 00:00 => cron: '0 16 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  actions: write  # 需要此权限才能更新仓库变量 SOCKS5_PROXY

jobs:
  update-socks5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取最新 socks5 代理列表
        run: |
          curl -s --max-time 30 \
            "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks5/data.txt" \
            -o /tmp/socks5_raw.txt
          echo "原始节点数: $(wc -l < /tmp/socks5_raw.txt)"

      - name: 筛选香港/新加坡并测试可用性
        run: |
          python3 scripts/filter_socks5.py /tmp/socks5_raw.txt /tmp/socks5_hk_sg.txt
          cat /tmp/socks5_hk_sg.txt

      - name: 上传为环境变量文件（覆盖更新）
        run: |
          mkdir -p output
          cp /tmp/socks5_hk_sg.txt output/socks5_proxy.txt
          # 生成逗号分隔格式，便于一些工具直接使用
          tr '\n' ',' < /tmp/socks5_hk_sg.txt | sed 's/,$//' > output/socks5_proxy.csv
          echo "已生成:"
          ls -la output/

      - name: 更新仓库变量 SOCKS5_PROXY（通过 gh CLI）
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 将节点列表作为多行字符串写入 GitHub Actions 变量 SOCKS5_PROXY 
          gh variable set SOCKS5_PROXY --body "$(cat /tmp/socks5_hk_sg.txt)" --repo "${{ github.repository }}"

      - name: 提交并推送筛选结果（可选，如需保留历史）
        if: false # 默认关闭：如需在仓库中保留列表文件，改为 true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/socks5_proxy.txt output/socks5_proxy.csv
          git commit -m "chore: update socks5 proxy list $(date -u +%Y-%m-%d)" || echo "无变化，跳过提交"
          git push

      - name: 🧹 清理旧的工作流运行记录
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done 
