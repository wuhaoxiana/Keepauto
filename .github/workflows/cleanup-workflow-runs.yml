name: 清理工作流历史记录

on:
  # 每 2 天凌晨 2:50（UTC）自动执行
  # 即北京时间每 2 天 10:50 执行
  schedule:
    - cron: '50 2 */2 * *'

  # 支持手动触发
  workflow_dispatch:

# 同一时间只允许一个实例运行
concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    # 单次任务最长运行 15 分钟
    timeout-minutes: 15

    permissions:
      actions: write
      contents: read

    steps:
      - name: 🧹 清理历史工作流运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 1; // 每个 workflow 保留最近 1 次运行记录

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            core.info(
              `开始清理 ${owner}/${repo} 的工作流历史记录，` +
              `每个 workflow 保留最近 ${KEEP} 次运行记录，` +
              `当前 Run ID ${currentRunId} 不会被删除`
            );

            // 1. 获取仓库中的所有 workflows
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            core.info(`共发现 ${workflows.length} 个 workflow`);

            let totalDeleted = 0;

            // 2. 逐个 workflow 处理
            for (const wf of workflows) {
              // 获取当前 workflow 的全部运行记录
              // GitHub API 默认按创建时间倒序返回
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 100
                }
              );

              // 如果运行记录数量没有超过保留数量，则无需清理
              if (runs.length <= KEEP) {
                core.info(
                  `[${wf.name}] 共 ${runs.length} 条记录，无需清理`
                );
                continue;
              }

              // 3. 获取需要删除的运行记录
              // 保留最新 KEEP 条
              // 同时跳过当前正在执行的 workflow run
              const toDelete = runs
                .slice(KEEP)
                .filter(run => run.id !== currentRunId);

              core.info(
                `[${wf.name}] 共 ${runs.length} 条记录，` +
                `计划删除 ${toDelete.length} 条`
              );

              let deleted = 0;

              // 4. 逐条删除历史运行记录
              for (const run of toDelete) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  });

                  deleted++;
                } catch (err) {
                  // 单条删除失败不会影响后续清理
                  core.warning(
                    `[${wf.name}] 删除 Run ${run.id} 失败：${err.message}`
                  );
                }
              }

              core.info(
                `[${wf.name}] 实际删除 ${deleted}/${toDelete.length} 条记录`
              );

              totalDeleted += deleted;
            }

            // 5. 输出最终清理结果
            core.info(
              `清理完成，共删除 ${totalDeleted} 条历史工作流记录`
            );
